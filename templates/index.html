<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表位置图查询系统</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f4f6f9;
    color: #333;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #1a3a5c 0%, #2563a8 100%);
    color: #fff;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  header h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: .5px; }
  header .subtitle { font-size: .8rem; opacity: .75; margin-top: 2px; }

  /* ── Search bar ── */
  .search-bar {
    background: #fff;
    border-bottom: 1px solid #dde3ec;
    padding: 14px 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-bar input[type="text"] {
    flex: 1 1 260px;
    padding: 9px 14px;
    font-size: .95rem;
    border: 1px solid #c8d0dc;
    border-radius: 6px;
    outline: none;
    transition: border-color .2s;
  }
  .search-bar input[type="text"]:focus { border-color: #2563a8; }
  .search-bar select {
    padding: 9px 12px;
    font-size: .9rem;
    border: 1px solid #c8d0dc;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    outline: none;
  }
  .search-bar button {
    padding: 9px 22px;
    background: #2563a8;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: .95rem;
    cursor: pointer;
    transition: background .2s;
  }
  .search-bar button:hover { background: #1a4d8a; }

  /* ── Main content ── */
  main { padding: 20px 24px; }

  /* ── Status bar ── */
  .status {
    font-size: .85rem;
    color: #666;
    margin-bottom: 16px;
    min-height: 22px;
  }
  .status .count { font-weight: 600; color: #2563a8; }
  .status .warn  { color: #b35d00; }

  /* ── Stats cards (initial view) ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #fff;
    border-radius: 8px;
    padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    cursor: pointer;
    transition: box-shadow .15s, transform .15s;
    border-left: 3px solid #2563a8;
  }
  .stat-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.14); transform: translateY(-1px); }
  .stat-card .label { font-size: .8rem; color: #888; margin-bottom: 4px; }
  .stat-card .num   { font-size: 1.5rem; font-weight: 700; color: #2563a8; }
  .stat-card .sub   { font-size: .75rem; color: #aaa; margin-top: 2px; }

  /* ── Results grid ── */
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.09);
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.16); transform: translateY(-2px); }
  .card img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #f7f8fa;
    display: block;
    border-bottom: 1px solid #eef0f4;
  }
  .card-info { padding: 10px 12px; }
  .card-tag  { font-size: .9rem; font-weight: 700; color: #1a3a5c; word-break: break-all; }
  .card-meta { font-size: .75rem; color: #888; margin-top: 4px; }

  /* ── Empty / loading ── */
  .hint {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
    font-size: .95rem;
  }
  .hint .icon { font-size: 2.5rem; margin-bottom: 12px; }

  /* ── Lightbox ── */
  #lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.82);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 92vw;
    max-height: 82vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  #lb-info {
    color: #fff;
    margin-top: 14px;
    text-align: center;
    font-size: .9rem;
  }
  #lb-info .lb-tag     { font-size: 1.1rem; font-weight: 700; }
  #lb-info .lb-meta    { opacity: .7; margin-top: 4px; font-size: .8rem; }
  #lb-close {
    position: fixed; top: 16px; right: 22px;
    color: #fff; font-size: 2rem; cursor: pointer;
    opacity: .8; line-height: 1;
  }
  #lb-close:hover { opacity: 1; }
  #lb-prev, #lb-next {
    position: fixed; top: 50%; transform: translateY(-50%);
    color: #fff; font-size: 2.2rem; cursor: pointer;
    opacity: .6; user-select: none; padding: 10px;
  }
  #lb-prev:hover, #lb-next:hover { opacity: 1; }
  #lb-prev { left: 12px; }
  #lb-next { right: 12px; }
  #lb-counter {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.6); font-size: .8rem;
  }

  @media (max-width: 540px) {
    .search-bar { padding: 10px 14px; }
    main { padding: 14px; }
    .results-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>仪表位置图查询系统</h1>
    <div class="subtitle" id="header-stats">加载中…</div>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="q" placeholder="输入位号（如 FT-03001、PT、LT-04）" autocomplete="off">
  <select id="drawing-filter">
    <option value="">全部图纸</option>
    {% for d in drawings %}
    <option value="{{ d }}">{{ d }}</option>
    {% endfor %}
  </select>
  <button onclick="doSearch()">搜索</button>
</div>

<main>
  <div class="status" id="status"></div>
  <div id="content">
    <!-- initial stats view -->
    <div id="stats-view">
      <div class="stats-grid" id="stats-grid"></div>
    </div>
    <!-- results -->
    <div class="results-grid" id="results-grid" style="display:none"></div>
    <!-- hints -->
    <div class="hint" id="hint-empty"  style="display:none">
      <div class="icon">🔍</div>未找到匹配的仪表位号
    </div>
    <div class="hint" id="hint-start" style="display:none">
      <div class="icon">📐</div>输入位号开始查询
    </div>
  </div>
</main>

<!-- Lightbox -->
<div id="lightbox">
  <span id="lb-close" onclick="closeLightbox()">✕</span>
  <span id="lb-prev"  onclick="lbNav(-1)">‹</span>
  <img  id="lb-img" src="" alt="">
  <div  id="lb-info">
    <div class="lb-tag"  id="lb-tag"></div>
    <div class="lb-meta" id="lb-meta"></div>
  </div>
  <span id="lb-next"    onclick="lbNav(1)">›</span>
  <div  id="lb-counter" id="lb-counter"></div>
</div>

<script>
let currentResults = [];
let lbIndex = 0;

// ── Debounce ──────────────────────────────────
let debTimer = null;
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(debTimer);
  const v = document.getElementById('q').value.trim();
  if (v.length >= 2) debTimer = setTimeout(doSearch, 350);
  else if (v.length === 0) showStats();
});
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(debTimer); doSearch(); }
});

// ── Search ────────────────────────────────────
async function doSearch() {
  const q       = document.getElementById('q').value.trim();
  const drawing = document.getElementById('drawing-filter').value;
  if (!q) { showStats(); return; }

  setStatus('搜索中…');
  hide('stats-view'); hide('hint-start'); hide('hint-empty');
  show('results-grid', 'grid');

  const url = `/api/search?q=${encodeURIComponent(q)}&drawing=${encodeURIComponent(drawing)}`;
  try {
    const data = await (await fetch(url)).json();
    currentResults = data.results;
    renderResults(data);
    updateUrl(q, drawing);
  } catch(e) {
    setStatus('请求失败: ' + e.message);
  }
}

function renderResults(data) {
  const grid = document.getElementById('results-grid');
  grid.innerHTML = '';

  if (data.count === 0) {
    hide('results-grid'); show('hint-empty'); setStatus(''); return;
  }

  const warn = data.truncated
    ? ` <span class="warn">(仅显示前 200 条)</span>` : '';
  setStatus(`找到 <span class="count">${data.count}</span> 条结果${warn}`);

  data.results.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const pageStr = r.page != null ? `第 ${r.page} 页` : '';
    const seqStr  = r.seq  != null ? `序号 ${r.seq}` : '';
    const meta    = [r.drawing_label, pageStr, seqStr].filter(Boolean).join(' · ');
    card.innerHTML = `
      <img src="${r.image_url}" loading="lazy" alt="${r.tag}">
      <div class="card-info">
        <div class="card-tag">${r.tag}</div>
        <div class="card-meta">${meta}</div>
      </div>`;
    card.onclick = () => openLightbox(i);
    grid.appendChild(card);
  });
}

// ── Stats (home view) ─────────────────────────
async function loadStats() {
  try {
    const d = await (await fetch('/api/stats')).json();
    document.getElementById('header-stats').textContent =
      `共 ${d.total} 张位置图，${Object.keys(d.drawings).length} 张图纸`;

    const grid = document.getElementById('stats-grid');
    grid.innerHTML = '';
    // Total card
    const tot = mk('div', 'stat-card');
    tot.innerHTML = `<div class="label">全部图片</div>
                     <div class="num">${d.total}</div>
                     <div class="sub">点击查看全部</div>`;
    tot.onclick = () => { setDrawing(''); searchAll(); };
    grid.appendChild(tot);

    Object.entries(d.drawings).forEach(([label, cnt]) => {
      const c = mk('div', 'stat-card');
      c.innerHTML = `<div class="label">${label}</div>
                     <div class="num">${cnt}</div>
                     <div class="sub">张位置图</div>`;
      c.onclick = () => { setDrawing(label); searchAll(); };
      grid.appendChild(c);
    });
  } catch(e) { console.error(e); }
}

function showStats() {
  hide('results-grid'); hide('hint-empty'); hide('hint-start');
  show('stats-view');
  setStatus('');
  updateUrl('', '');
}

function searchAll() {
  // clicking a stat card opens that drawing with empty query to show all
  // We search for a very generic query so we don't show hint-start
  // Instead, we'll use a special "show all" flag
  const drawing = document.getElementById('drawing-filter').value;
  doSearchRaw('', drawing, true);
}

async function doSearchRaw(q, drawing, showAll) {
  if (!q && !showAll) { showStats(); return; }
  hide('stats-view'); hide('hint-start'); hide('hint-empty');
  show('results-grid', 'grid');

  let url;
  if (showAll) {
    // fetch all for selected drawing by using empty query with all=1
    url = `/api/search_all?drawing=${encodeURIComponent(drawing)}`;
  } else {
    url = `/api/search?q=${encodeURIComponent(q)}&drawing=${encodeURIComponent(drawing)}`;
  }
  try {
    const data = await (await fetch(url)).json();
    currentResults = data.results;
    renderResults(data);
  } catch(e) { setStatus('请求失败'); }
}

// ── Lightbox ──────────────────────────────────
function openLightbox(i) {
  lbIndex = i;
  renderLb();
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
function renderLb() {
  const r = currentResults[lbIndex];
  document.getElementById('lb-img').src  = r.image_url;
  document.getElementById('lb-tag').textContent  = r.tag;
  const pageStr = r.page != null ? `第 ${r.page} 页` : '';
  const seqStr  = r.seq  != null ? `序号 ${r.seq}` : '';
  document.getElementById('lb-meta').textContent =
    [r.drawing_label, pageStr, seqStr].filter(Boolean).join(' · ');
  document.getElementById('lb-counter').textContent =
    `${lbIndex + 1} / ${currentResults.length}`;
}
function lbNav(dir) {
  lbIndex = (lbIndex + dir + currentResults.length) % currentResults.length;
  renderLb();
}
document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLightbox();
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'ArrowLeft')  lbNav(-1);
});
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});

// ── URL state ─────────────────────────────────
function updateUrl(q, drawing) {
  const p = new URLSearchParams();
  if (q)       p.set('q', q);
  if (drawing) p.set('drawing', drawing);
  const str = p.toString();
  history.replaceState(null, '', str ? '?' + str : location.pathname);
}
function setDrawing(label) {
  const sel = document.getElementById('drawing-filter');
  sel.value = label;
}

// ── Helpers ───────────────────────────────────
function show(id, display='block') { document.getElementById(id).style.display = display; }
function hide(id)                  { document.getElementById(id).style.display = 'none'; }
function setStatus(html)           { document.getElementById('status').innerHTML = html; }
function mk(tag, cls) {
  const el = document.createElement(tag);
  el.className = cls;
  return el;
}

// ── Init ──────────────────────────────────────
(async () => {
  await loadStats();
  const p = new URLSearchParams(location.search);
  const q = p.get('q') || '';
  const d = p.get('drawing') || '';
  if (d) setDrawing(d);
  if (q) {
    document.getElementById('q').value = q;
    doSearch();
  } else {
    showStats();
  }
})();
</script>
</body>
</html>
